####
# tmux configuration
#
# Plugins are managed by tpm, which is vendored as a git submodule at
# ~/.tmux/plugins/tpm and initialised by `yadm bootstrap`. There is nothing to
# clone by hand. After changing this file:
#
#   prefix + r    reload this config
#   prefix + I    install plugins added below
#   prefix + y    copy line to clipboard (tmux-yank)
#   prefix + C-s  save session   /  prefix + C-r  restore session (resurrect)
#
# Cheat sheet: http://www.dayid.org/comp/tm.html
####

####
# Terminal, keys and general behaviour
####

# 0 is too far from ` ;)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ",xterm-ghostty:extkeys"

# Keep this OFF. Passthrough lets applications write escape sequences straight
# to the terminal, which desynchronises tmux's screen model and causes the TUI
# redraw artifacts this config already fights elsewhere (locale + terminfo).
# It was disabled deliberately in f5859ea and silently re-enabled in 48c5fdc;
# do not flip it back without a concrete need (e.g. inline images) and a note
# here explaining the trade-off.
set -g allow-passthrough off

# Advertise synchronized output so full-screen redraws are not torn.
set -as terminal-features ",*:sync"

# Use the login shell rather than a hardcoded path: /bin/zsh is the ancient
# system zsh on macOS (Homebrew installs a newer one) and does not exist at
# that path on every Linux distribution.
set -g default-command "${SHELL}"

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

set-option -g focus-events on
set -g status-keys vi
set -g history-limit 100000

setw -g mode-keys vi
set -g mouse on

# Flag activity in the status bar, but do not interrupt with a message overlay.
setw -g monitor-activity on
set -g visual-activity off

# Short escape delay: 0 can mangle escape sequences from TUI apps; 10ms is
# imperceptible and lets tmux tell a lone Esc apart from a sequence.
set -sg escape-time 10

####
# Key bindings
####

# Splits inherit the current pane's working directory.
bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key H resize-pane -L 5
bind-key L resize-pane -R 5

bind-key M-j resize-pane -D
bind-key M-k resize-pane -U
bind-key M-h resize-pane -L
bind-key M-l resize-pane -R

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use Alt-vim keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# NOTE: Home/End are deliberately NOT rebound here. The old
# `bind -n Home send-key C-a` / `bind -n End send-key C-e` workaround hijacked
# those keys globally and broke them inside vim and every other TUI. They work
# natively now that bootstrap compiles a modern tmux-256color terminfo.

# Reload tmux config
bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

####
# Optional "proxy" pane on session creation
####

# The command itself lives OUTSIDE this repo, in ~/.config/tmux/proxy-command
# (a single line). It is typed into the pane, not executed, so it can be
# reviewed or edited first. No file -> no hook and no extra pane.
if-shell '[ -r "$HOME/.config/tmux/proxy-command" ]' {
  set -g pane-border-status top
  set -g pane-border-format " #{pane_index}: #{pane_title} "
  set-hook -g session-created {
    split-window -h
    select-pane -T proxy
    run-shell 'tmux send-keys "$(cat "$HOME/.config/tmux/proxy-command") "'
  }
}

####
# Plugins
####

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-urlview'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'GROG/tmux-plugin-mem'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'tmux-plugins/tmux-yank'

# Do NOT auto-restore the previous session on startup. Manual save/restore
# (prefix + C-s / prefix + C-r) still works.
set -g @continuum-restore 'off'
set -g @continuum-save-interval '5'
set -g @resurrect-capture-pane-contents 'on'

set -g @mem_high_percentage "80"
set -g @mem_low_percentage "40"
set -g @mem_ignore_cached "no"

set -g @batt_remain_short true

####
# Colourscheme: gruvbox dark
#
# NOTE: every `set` on a *-style option REPLACES the whole style string, it
# does not merge. Splitting bg= and fg= across two lines silently drops the
# first one, which is why each style below is a single declaration.
####

set-option -g status "on"
set-option -g status-style "bg=colour237,fg=colour223"          # bg1 / fg1
set-option -g status-justify "left"
set-option -g status-left-style "none"
set-option -g status-left-length "80"
set-option -g status-right-style "none"
set-option -g status-right-length "200"

# Inactive and activity window styles are intentionally unstyled: the
# window-status-format strings below carry their own colours.
set-window-option -g window-status-style "none"
set-window-option -g window-status-activity-style "none"
set-window-option -g window-status-separator ""
set-window-option -g window-status-current-style "bg=default,fg=colour237"

# pane border
set-option -g pane-active-border-style "fg=colour250"           # fg2
set-option -g pane-border-style "fg=colour237"                  # bg1

# messages and the command prompt
set-option -g message-style "bg=colour239,fg=colour223"         # bg2 / fg1
set-option -g message-command-style "bg=colour239,fg=colour223"

# pane number display
set-option -g display-panes-active-colour colour250             # fg2
set-option -g display-panes-colour colour237                    # bg1

# clock
set-window-option -g clock-mode-colour colour109                # blue

# bell
set-window-option -g window-status-bell-style "fg=colour235,bg=colour167"

set-option -g status-left "#[fg=colour248, bg=colour241] #S #[fg=colour241, bg=colour237, nobold, noitalics, nounderscore] C:#{continuum_status}"
set-option -g status-right "#[fg=colour239, bg=colour237, nobold, nounderscore, noitalics]#[fg=colour246,bg=colour239] Memory:#{mem_percentage} Batt:#{battery_percentage} #{battery_remain} #[fg=colour246,bg=colour239] %Y-%m-%d  %H:%M #[fg=colour248, bg=colour239, nobold, noitalics, nounderscore]#[fg=colour237, bg=colour248] #h "

set-window-option -g window-status-current-format "#[fg=colour239, bg=colour248, nobold, noitalics, nounderscore]#[fg=colour239, bg=colour214] #I #[fg=colour239, bg=colour214, bold] #W #[fg=colour214, bg=colour237, nobold, noitalics, nounderscore]"
set-window-option -g window-status-format "#[fg=colour237,bg=colour239,noitalics]#[fg=colour223,bg=colour239] #I #[fg=colour223, bg=colour239] #W #[fg=colour239, bg=colour237, noitalics]"

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
